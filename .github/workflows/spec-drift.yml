name: spec-drift
# Fails when the SDK types drift from the committed spec snapshot, spec/openapi.json.
# The snapshot is refreshed by hand (go run ./internal/specdrift -update-snapshot), so
# this check needs no network and does not turn red when the upstream API changes
# under an unrelated PR.
# See internal/specdrift and CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  check:
    name: spec drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: ./go.mod

      - name: Check spec drift
        run: |
          set -o pipefail
          go run ./internal/specdrift | tee drift.txt
        continue-on-error: true
        id: drift

      - name: Write job summary
        run: |
          {
            echo "## Spec drift"
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: steps.drift.outcome == 'failure'
        run: |
          echo "::error::SDK types drift from spec/openapi.json. See the job summary."
          exit 1
